x-volumes:
  config: &config D:/GLogWare2/CompanyCity/Config:/app/Config
  logfiles: &logfiles D:/GLogWare2/CompanyCity/Logfiles:/app/Logfiles

x-tz-env: &tz-env
  TZ: Europe/Zurich

services:
  bridgemanager-op7100br:
    image: bridgemanager:latest
    container_name: BridgeManager-OP7100BR
    environment:
      OP: OP7100BR
      <<: *tz-env
    volumes:
      - *config
      - *logfiles

  bridgemanager-op7200br:
    image: bridgemanager:latest
    container_name: BridgeManager-OP7200BR
    environment:
      OP: OP7200BR
      <<: *tz-env
    volumes:
      - *config
      - *logfiles

  conveyormanager-op1000al:
    image: conveyormanager:latest
    container_name: ConveyorManager-OP1000AL
    environment:
      OP: OP1000AL
      <<: *tz-env
    volumes:
      - *config
      - *logfiles

  conveyormanager-op20000al:
    image: conveyormanager:latest
    container_name: ConveyorManager-OP2000AL
    environment:
      OP: OP2000AL
      <<: *tz-env
    volumes:
      - *config
      - *logfiles

  jobmanager:
    image: jobmanager:latest
    container_name: JobManager
    environment:
      <<: *tz-env
    volumes:
      - *config
      - *logfiles

  reserve:
    image: reserve:latest
    container_name: Reserve
    environment:
      <<: *tz-env
    volumes:
      - *config
      - *logfiles

  garbage:
    image: garbage:latest
    container_name: Garbage
    environment:
      <<: *tz-env
    volumes:
      - *config
      - *logfiles

  glogwarewebapp:
     image: glogwarewebapp:latest
     container_name: GLogWareWebApp
     environment:
       <<: *tz-env
     ports:
       - "82:8080"
     volumes:
       - *config
       - *logfiles