x-volumes:
  config: &config ${HOME_DIR}/Config:${DOCKER_APP_DIR}/Config
  logfiles: &logfiles ${HOME_DIR}/Logfiles:${DOCKER_APP_DIR}/Logfiles

x-tz-env: &tz-env
  TZ: Europe/Zurich

services:
  bridgesimulator-op7100br:
    image: bridgesimulator:latest
    container_name: BridgeSimulator-OP7100BR
    environment:
      OP: OP7100BR
      <<: *tz-env
    ports:
      - "7100:7100"
    volumes:
      - *config
      - *logfiles
  bridgesimulator-op7200br:
    image: bridgesimulator:latest
    container_name: BridgeSimulator-OP7200BR
    environment:
      OP: OP7200BR
      <<: *tz-env
    ports:
      - "7200:7200"
    volumes:
      - *config
      - *logfiles
