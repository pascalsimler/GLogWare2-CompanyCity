x-volumes:
  config: &config /home/glogware/GLogWare/CompanyCity/Config:/app/Config
  logfiles: &logfiles /home/glogware/GLogWare/CompanyCity/Logfiles:/app/Logfiles

x-tz-env: &tz-env
  TZ: Europe/Zurich

services:
  bridgesimulator-op7100br:
    image: bridgesimulator:latest
    container_name: BridgeSimulator-OP7100BR
    environment:
      OP: OP7100BR
      <<: *tz-env
    ports:
      - "7100:7100"
    volumes:
      - *config
      - *logfiles

  bridgesimulator-op7200br:
    image: bridgesimulator:latest
    container_name: BridgeSimulator-OP7200BR
    environment:
      OP: OP7200BR
      <<: *tz-env
    ports:
      - "7200:7200"
    volumes:
      - *config
      - *logfiles

  conveyorsimulator-op1000al:
    image: conveyorsimulator:latest
    container_name: ConveyorSimulator-OP1000AL
    environment:
      OP: OP1000AL
      <<: *tz-env
    ports:
      - "1000:1000"
    volumes:
      - *config
      - *logfiles

  conveyorsimulator-op2000al:
    image: conveyorsimulator:latest
    container_name: ConveyorSimulator-OP72000AL
    environment:
      OP: OP72000AL
      <<: *tz-env
    ports:
      - "2000:2000"
    volumes:
      - *config
      - *logfiles

  simulatorwebapp:
     image: simulatorwebapp:latest
     container_name: SimulatorWebApp
     environment:
       <<: *tz-env
     ports:
       - "81:8080"
     volumes:
       - *config
       - *logfiles